<!doctype html>
<html
  lang="es"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"videoSrc","type":"string","label":"Video de fondo (Pexels)","default":"assets/placeholder.mp4"},
    {"id":"headline","type":"string","label":"Destino / Hotel","default":"Punta Cana","maxLength":40},
    {"id":"subtitle","type":"string","label":"Gancho / oferta","default":"Playas de arena blanca a un vuelo de distancia","maxLength":80},
    {"id":"cta","type":"string","label":"CTA","default":"Guía completa en el link ↓","maxLength":60}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Quisqueya Travel — Reel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        color: #fff;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* Fondo: el video ocupa toda la composición */
      #bg-wrap {
        position: absolute;
        inset: 0;
      }
      #bg-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Degradados para legibilidad del texto */
      #shade-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 620px;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0));
      }
      #shade-bottom {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 780px;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.82), rgba(0, 0, 0, 0));
      }

      /* Marca, esquina superior */
      #brand {
        position: absolute;
        top: 64px;
        left: 56px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      #brand-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ffb800;
      }
      #brand-text {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      }

      /* Bloque de texto inferior */
      #text-block {
        position: absolute;
        left: 56px;
        right: 56px;
        bottom: 300px;
      }
      #headline {
        font-size: 108px;
        line-height: 1.02;
        font-weight: 800;
        letter-spacing: -1px;
        text-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
      }
      #subtitle {
        margin-top: 28px;
        font-size: 46px;
        line-height: 1.25;
        font-weight: 500;
        max-width: 940px;
        color: #f2f2f2;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
      }

      /* Barra de CTA fija abajo */
      #cta-bar {
        position: absolute;
        left: 56px;
        right: 56px;
        bottom: 100px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      #cta-pill {
        background: #ffb800;
        color: #14110b;
        font-weight: 700;
        font-size: 40px;
        padding: 22px 40px;
        border-radius: 100px;
        white-space: nowrap;
      }
      #cta-url {
        font-size: 38px;
        font-weight: 600;
        color: #fff;
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="9"
    >
      <div id="bg-wrap">
        <video
          id="bg-video"
          class="clip"
          data-start="0"
          data-duration="9"
          data-track-index="0"
          data-var-src="videoSrc"
          src="assets/placeholder.mp4"
          muted
          playsinline
        ></video>
      </div>

      <div id="shade-top"></div>
      <div id="shade-bottom"></div>

      <div id="brand" class="clip" data-start="0" data-duration="9" data-track-index="1">
        <div id="brand-dot"></div>
        <div id="brand-text">Quisqueya Travel</div>
      </div>

      <div id="text-block" class="clip" data-start="0" data-duration="9" data-track-index="2">
        <h1 id="headline" data-var-text="headline">Punta Cana</h1>
        <p id="subtitle" data-var-text="subtitle">Playas de arena blanca a un vuelo de distancia</p>
      </div>

      <div id="cta-bar" class="clip" data-start="1.4" data-duration="7.6" data-track-index="3">
        <div id="cta-pill">Ver guía</div>
        <div id="cta-url" data-var-text="cta">Guía completa en el link ↓</div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Marca: aparece de una, discreta
      tl.fromTo("#brand", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.1);

      // Headline: gancho principal, entra fuerte
      tl.fromTo(
        "#headline",
        { opacity: 0, y: 60 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0.25
      );

      // Subtitle: sigue de cerca
      tl.fromTo(
        "#subtitle",
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.5
      );

      // CTA: entra al final del primer segundo y medio, se queda fija
      tl.fromTo(
        "#cta-bar",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        1.4
      );

      // Respiración sutil del headline para dar vida sin distraer
      tl.to("#headline", { scale: 1.015, duration: 4.5, ease: "sine.inOut" }, 2.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
