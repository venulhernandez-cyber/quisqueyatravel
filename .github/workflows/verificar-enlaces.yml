name: Verificar Enlaces

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --base-url https://quisqueyatravel.org
            --root-dir "$(pwd)"
            --verbose --no-progress
            -X get
            --exclude '^https://(www\.)?instagram\.com'
            --exclude '^https://eticket\.migracion\.gob\.do'
            --exclude '^https://(www\.)?getyourguide\.'
            --exclude '^https://(www\.)?viator\.com'
            './**/*.html'
          fail: false

      - name: Cerrar reportes anteriores
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'enlaces-rotos'
            });
            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

      - name: Crear Issue si hay enlaces rotos
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Reporte de enlaces rotos"
          content-filepath: ./lychee/out.md
          labels: enlaces-rotos, automatizado